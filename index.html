<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hill AI</title>
<meta name="description" content="Hill AI by Hillar Tech helps students with coding and debugging.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%234169E1'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--brand:#4169E1;--brand2:#2f54c9;--soft:#e8eefd;--bg:#fbf7ee;--card:#fff;--side:#f4efe2;--text:#1c2033;--mut:#6b7190;--bd:#e6dfcc;--code:#0f1424;--codeh:#1a2138;--codet:#e8ecff;--ubub:#dfe7ff;--ok:#22c55e;--err:#dc2626;--r:16px}
[data-theme=dark]{--brand:#5d82ff;--brand2:#4169E1;--soft:#1c2547;--bg:#0e1222;--card:#171c33;--side:#0b0f1d;--text:#e9edff;--mut:#98a0c4;--bd:#262d4d;--code:#080b16;--codeh:#12182d;--ubub:#26356b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.6 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;height:100dvh}
aside{width:280px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px;gap:10px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;padding:10px;border-radius:12px;font-weight:600}
.btn:hover{background:var(--brand2)}
#search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);outline:0}
#search:focus,.box:focus-within{border-color:var(--brand)}
#list{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#list li{display:flex;align-items:center;border-radius:10px}
#list li:hover,#list li.act{background:var(--soft)}
#list .t{flex:1;min-width:0;text-align:left;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .empty{color:var(--mut);padding:8px 10px;font-size:.85rem}
.mini{color:var(--mut);padding:6px;font-size:.75rem;border-radius:6px}
.mini:hover{color:var(--brand)}
.by{color:var(--mut);font-size:.75rem;text-align:center}
#ov{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex:none}
.top h1{margin:0;font-size:1.4rem;font-weight:800}
.on{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--mut)}
.on i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.top .sp{flex:1}
.ic{width:38px;height:38px;border-radius:10px;color:var(--mut)}
.ic:hover{background:var(--soft);color:var(--brand)}
#menu{display:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex:none;background:var(--brand);color:#fff;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover;display:block}
#scroll{flex:1;overflow-y:auto}
#msgs{max-width:820px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.row{display:flex;gap:10px}
.row.user{justify-content:flex-end}
.bub{padding:10px 14px;border-radius:var(--r);overflow-wrap:anywhere}
.user .bub{background:var(--ubub);max-width:85%;white-space:pre-wrap;border-bottom-right-radius:4px}
.ai .col{min-width:0;max-width:calc(100% - 46px)}
.ai .bub{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.bub p{margin:.45em 0}
.bub>:first-child{margin-top:0}
.bub>:last-child{margin-bottom:0}
.bub h3,.bub h4,.bub h5,.bub h6{margin:.8em 0 .3em}
.bub ul,.bub ol{margin:.4em 0;padding-left:1.3em}
.bub code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
.code{margin:10px 0;border-radius:12px;overflow:hidden;background:var(--code)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--codeh);color:#aab4e0;font-size:.78rem}
.cb{color:#aab4e0;font-size:.78rem}
.cb:hover{color:#fff}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code pre code{background:none;color:var(--codet);padding:0;font-size:.85rem;white-space:pre}
.bar{display:flex;align-items:center;gap:4px;margin-top:4px;color:var(--mut);font-size:.78rem}
.ab{color:var(--mut);padding:5px 7px;border-radius:7px;font-size:.82rem}
.ab:hover{background:var(--soft);color:var(--brand)}
.ab.on{color:var(--brand);background:var(--soft)}
.time{padding:0 6px}
.dots{display:flex;gap:5px;padding:6px 2px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:bn 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
.bub.err{border-color:var(--err);color:var(--err)}
.retry{margin-left:8px;color:var(--brand);font-weight:600;text-decoration:underline}
.welcome{margin:auto;text-align:center;max-width:640px;display:flex;flex-direction:column;align-items:center}
.welcome h2{margin:16px 0 6px;font-size:1.7rem;font-weight:800}
.welcome p{color:var(--mut);margin:0 0 20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(65,105,225,.15)}
.card i{color:var(--brand)}
.card b{font-size:.9rem}
.card span{color:var(--mut);font-size:.8rem}
footer{flex:none;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.box{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:8px 8px 8px 16px}
#inp{flex:1;border:0;outline:0;resize:none;background:none;max-height:160px;padding:6px 0;line-height:1.5}
.sendb{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;flex:none}
.sendb:disabled{opacity:.4;cursor:default}
.sendb.stop{background:var(--err)}
.note{text-align:center;color:var(--mut);font-size:.72rem;margin:6px 0 0}
@media(max-width:800px){
aside{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
aside.open{transform:none}
aside.open+#ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#menu{display:block}
.cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span id="sideAv"></span>Hill AI</div>
    <button class="btn" id="newChat"><i class="fa-solid fa-plus"></i> New chat</button>
    <input id="search" type="search" placeholder="Search chats…" aria-label="Search chats">
    <ul id="list"></ul>
    <div class="by">by Hillar Tech</div>
  </aside>
  <div id="ov"></div>
  <main>
    <header class="top">
      <button class="ic" id="menu" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <span id="topAv"></span>
      <h1>Hill AI</h1>
      <span class="on"><i></i>Online</span>
      <span class="sp"></span>
      <button class="ic" id="theme" aria-label="Toggle dark mode"></button>
    </header>
    <div id="scroll"><div id="msgs"></div></div>
    <footer>
      <div class="box">
        <textarea id="inp" rows="1" placeholder="Message Hill AI…" aria-label="Message"></textarea>
        <button class="sendb" id="send" disabled aria-label="Send"></button>
      </div>
      <p class="note">Hill AI can make mistakes. Verify important information.</p>
    </footer>
  </main>
</div>
<script src="script.js"></script>
</body>
  </html>
